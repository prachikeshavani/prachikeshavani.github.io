baseURL = "https://prachi-keshavani.github.io/"
locale = "en-us"
title = "Prachi Keshavani"
theme = "neofeed"

# How many feed entries to load at once
pagination.pagerSize = 6

[taxonomies]
tag = "tags"

[params.author]
name = "Prachi Keshavani"
# Profile image: external link or file in static/ (e.g. "image/me.webp")
image = ""
about = "Hi, I'm Prachi! Welcome to my personal feed."

[params]
# Skin options: "macintosh", "minimal", "cloudy-day"
# (or your own .css file placed in static/skins/)
skin = "macintosh"
githubuser = "prachi-keshavani"
# mastodon = "https://mastodon.social/@yourhandle"
# twitteruser = "yourhandle"

[permalinks]
# Format for feed entry links
posts = "/:title/"

[outputs]
home = ["HTML", "JSON", "RSS"]

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6470"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="810" fill="#ffffff"/>

  <!-- Step 1: Wrike intake (system) -->
  <rect x="140" y="20" width="440" height="62" rx="10" fill="#eceff3" stroke="#b8c2cc" stroke-width="1.5"/>
  <text x="156" y="41" font-size="10" letter-spacing="1.5" fill="#5b6470" font-weight="600">SYSTEM · WRIKE</text>
  <text x="156" y="58" font-size="14" fill="#1f2937" font-weight="600">Requester submits translation request form</text>
  <text x="156" y="74" font-size="11.5" fill="#4b5563">Wrike task created and assigned a task ID</text>

  <line x1="360" y1="82" x2="360" y2="104" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Python transfer (python) -->
  <rect x="140" y="104" width="440" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="156" y="125" font-size="10" letter-spacing="1.5" fill="#1d4ed8" font-weight="600">PYTHON · AUTOMATED</text>
  <text x="156" y="142" font-size="14" fill="#1e3a8a" font-weight="600">Python creates the project in XTM</text>
  <text x="156" y="158" font-size="11.5" fill="#1e40af">transfers request details and source files</text>

  <line x1="360" y1="166" x2="360" y2="188" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: XTM analysis (system) -->
  <rect x="140" y="188" width="440" height="62" rx="10" fill="#eceff3" stroke="#b8c2cc" stroke-width="1.5"/>
  <text x="156" y="209" font-size="10" letter-spacing="1.5" fill="#5b6470" font-weight="600">SYSTEM · XTM</text>
  <text x="156" y="226" font-size="14" fill="#1f2937" font-weight="600">XTM analyses the project</text>
  <text x="156" y="242" font-size="11.5" fill="#4b5563">translation costs generated per target language</text>

  <line x1="360" y1="250" x2="360" y2="272" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Human review (human) -->
  <rect x="140" y="272" width="440" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="156" y="293" font-size="10" letter-spacing="1.5" fill="#b45309" font-weight="600">HUMAN CHECKPOINT</text>
  <text x="156" y="310" font-size="14" fill="#78350f" font-weight="600">Analyst review before agency handoff</text>
  <text x="156" y="326" font-size="11.5" fill="#92400e">check agency assignment and costs · €1,000+ flagged to manager</text>

  <line x1="360" y1="334" x2="360" y2="356" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: POs (system) -->
  <rect x="140" y="356" width="440" height="62" rx="10" fill="#eceff3" stroke="#b8c2cc" stroke-width="1.5"/>
  <text x="156" y="377" font-size="10" letter-spacing="1.5" fill="#5b6470" font-weight="600">SYSTEM · XTM</text>
  <text x="156" y="394" font-size="14" fill="#1f2937" font-weight="600">Purchase orders sent to agencies</text>
  <text x="156" y="410" font-size="11.5" fill="#4b5563">through XTM's built-in purchase-order workflow</text>

  <line x1="360" y1="418" x2="360" y2="440" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Agencies (system) -->
  <rect x="140" y="440" width="440" height="62" rx="10" fill="#eceff3" stroke="#b8c2cc" stroke-width="1.5"/>
  <text x="156" y="461" font-size="10" letter-spacing="1.5" fill="#5b6470" font-weight="600">SYSTEM · AGENCIES</text>
  <text x="156" y="478" font-size="14" fill="#1f2937" font-weight="600">Agencies assign linguists</text>
  <text x="156" y="494" font-size="11.5" fill="#4b5563">translation is completed in XTM</text>

  <line x1="360" y1="502" x2="360" y2="524" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: Human trigger (human) -->
  <rect x="140" y="524" width="440" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="156" y="545" font-size="10" letter-spacing="1.5" fill="#b45309" font-weight="600">HUMAN CHECKPOINT</text>
  <text x="156" y="562" font-size="14" fill="#78350f" font-weight="600">Analyst triggers file retrieval</text>
  <text x="156" y="578" font-size="11.5" fill="#92400e">enters the XTM project ID into the retrieval script</text>

  <line x1="360" y1="586" x2="360" y2="608" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 8: Python retrieval (python) -->
  <rect x="140" y="608" width="440" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="156" y="629" font-size="10" letter-spacing="1.5" fill="#1d4ed8" font-weight="600">PYTHON · AUTOMATED</text>
  <text x="156" y="646" font-size="14" fill="#1e3a8a" font-weight="600">Python downloads translated files</text>
  <text x="156" y="662" font-size="11.5" fill="#1e40af">uploads them to the original Wrike task</text>

  <line x1="360" y1="670" x2="360" y2="692" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 9: Human completion (human) -->
  <rect x="140" y="692" width="440" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="156" y="713" font-size="10" letter-spacing="1.5" fill="#b45309" font-weight="600">HUMAN CHECKPOINT</text>
  <text x="156" y="730" font-size="14" fill="#78350f" font-weight="600">Final check and completion</text>
  <text x="156" y="746" font-size="11.5" fill="#92400e">verify files and language suffixes · task marked complete</text>

  <!-- Legend -->
  <rect x="140" y="772" width="14" height="14" rx="3" fill="#eceff3" stroke="#b8c2cc" stroke-width="1"/>
  <text x="160" y="783" font-size="11" fill="#4b5563">system step</text>
  <rect x="255" y="772" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="275" y="783" font-size="11" fill="#4b5563">automated by Python</text>
  <rect x="415" y="772" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="435" y="783" font-size="11" fill="#4b5563">human decision kept manual</text>
</svg>

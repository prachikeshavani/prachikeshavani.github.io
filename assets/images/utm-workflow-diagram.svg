<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6470"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="660" fill="#ffffff"/>

  <!-- Step 1: form (human) -->
  <rect x="140" y="20" width="440" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="156" y="41" font-size="10" letter-spacing="1.5" fill="#b45309" font-weight="600">HUMAN · WRIKE FORM</text>
  <text x="156" y="58" font-size="14" fill="#78350f" font-weight="600">Requester fills the UTM request form</text>
  <text x="156" y="74" font-size="11.5" fill="#92400e">URL, source(s), medium(s), campaign, content</text>

  <line x1="360" y1="82" x2="360" y2="104" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: trigger (automation) -->
  <rect x="140" y="104" width="440" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="156" y="125" font-size="10" letter-spacing="1.5" fill="#1d4ed8" font-weight="600">AUTOMATION · TRIGGER</text>
  <text x="156" y="142" font-size="14" fill="#1e3a8a" font-weight="600">Wrike Integrate recipe fires</text>
  <text x="156" y="158" font-size="11.5" fill="#1e40af">new/updated task in the UTM folder · no link yet</text>

  <line x1="360" y1="166" x2="360" y2="188" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: guard (automation) -->
  <rect x="140" y="188" width="440" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="156" y="209" font-size="10" letter-spacing="1.5" fill="#1d4ed8" font-weight="600">AUTOMATION · GUARD</text>
  <text x="156" y="226" font-size="14" fill="#1e3a8a" font-weight="600">Checks before building anything</text>
  <text x="156" y="242" font-size="11.5" fill="#1e40af">URL present? no existing UTM link? then build</text>

  <line x1="360" y1="250" x2="360" y2="272" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: parse (automation) -->
  <rect x="140" y="272" width="440" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="156" y="293" font-size="10" letter-spacing="1.5" fill="#1d4ed8" font-weight="600">AUTOMATION · PARSE</text>
  <text x="156" y="310" font-size="14" fill="#1e3a8a" font-weight="600">Multi-selects become arrays</text>
  <text x="156" y="326" font-size="11.5" fill="#1e40af">JSON parsing: one list per multi-select field</text>

  <line x1="360" y1="334" x2="360" y2="356" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: build (automation) -->
  <rect x="140" y="356" width="440" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="156" y="377" font-size="10" letter-spacing="1.5" fill="#1d4ed8" font-weight="600">AUTOMATION · BUILD</text>
  <text x="156" y="394" font-size="14" fill="#1e3a8a" font-weight="600">One tracking link per combination</text>
  <text x="156" y="410" font-size="11.5" fill="#1e40af">FOR EACH source × FOR EACH medium → concatenate</text>

  <line x1="360" y1="418" x2="360" y2="440" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: write back (system) -->
  <rect x="140" y="440" width="440" height="62" rx="10" fill="#eceff3" stroke="#b8c2cc" stroke-width="1.5"/>
  <text x="156" y="461" font-size="10" letter-spacing="1.5" fill="#5b6470" font-weight="600">SYSTEM · WRIKE</text>
  <text x="156" y="478" font-size="14" fill="#1f2937" font-weight="600">Links written back to the task</text>
  <text x="156" y="494" font-size="11.5" fill="#4b5563">task updated · requester notified · task completed</text>

  <!-- Legend -->
  <rect x="140" y="530" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="160" y="541" font-size="11" fill="#4b5563">human action</text>
  <rect x="260" y="530" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="280" y="541" font-size="11" fill="#4b5563">Wrike Integrate recipe</text>
  <rect x="440" y="530" width="14" height="14" rx="3" fill="#eceff3" stroke="#b8c2cc" stroke-width="1"/>
  <text x="460" y="541" font-size="11" fill="#4b5563">system step</text>
</svg>
